<!-- Fragmento de formulario de técnico (reutilizado en Add y Edit) -->
<div class="mb-3">
  <label class="form-label fw-semibold">Nombre completo *</label>
  <input type="text" name="name" class="form-control" required placeholder="Ej: Juan Carlos López">
</div>
<div class="row g-2 mb-3">
  <div class="col-6">
    <label class="form-label fw-semibold">Código</label>
    <input type="text" name="code" class="form-control" placeholder="T001">
  </div>
  <div class="col-6">
    <label class="form-label fw-semibold">Supervisor</label>
    <input type="text" name="supervisor" class="form-control" placeholder="Nombre supervisor">
  </div>
</div>
<div class="mb-3">
  <label class="form-label fw-semibold">Turno Fijo</label>
  <select name="fixed_shift" class="form-select">
    <option value="">Rotación automática</option>
    <option value="T1">Siempre T1 (7:30–16:30)</option>
    <option value="T2">Siempre T2 (10:30–19:30)</option>
  </select>
</div>
<div class="mb-2">
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" id="addTickets" name="tickets_only">
    <label class="form-check-label" for="addTickets">
      <i class="bi bi-ticket-detailed text-warning me-1"></i>Exclusivo de Tickets
    </label>
  </div>
</div>
<div class="mb-2">
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" id="addNoSun" name="no_sundays">
    <label class="form-check-label" for="addNoSun">
      <i class="bi bi-x-circle text-danger me-1"></i>Sin asignación dominicales/festivos
    </label>
  </div>
</div>
